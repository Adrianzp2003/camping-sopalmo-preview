name: Link check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check static-site links
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan every static page; the api/* POST target is a known
          # Pages dead-end (honest error state) and is excluded.
          args: --verbose --no-progress --exclude 'api/*' './**/*.html'
          fail: true
